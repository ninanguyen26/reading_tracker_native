services:
  - type: web
    name: reading-tracker-metadata
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: HARDCOVER_TOKEN
        sync: false
